<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Gradient -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15CFEA"/>
      <stop offset="50%" stop-color="#3E8EF8"/>
      <stop offset="100%" stop-color="#A52CF7"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background transparent -->
  <rect width="500" height="500" fill="transparent"/>

  <!-- ROTATING GROUP -->
  <g>

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 250 250"
      to="360 250 250"
      dur="6s"
      repeatCount="indefinite"/>

    <!-- Outer Ring -->
    <circle cx="250" cy="250" r="145"
      fill="none"
      stroke="url(#ring)"
      stroke-width="6"
      opacity="0.7"
      filter="url(#glow)"/>

    <!-- Middle Ring -->
    <circle cx="250" cy="250" r="115"
      fill="none"
      stroke="url(#ring)"
      stroke-width="4"
      opacity="0.6"
      filter="url(#glow)"/>

    <!-- Inner Ring -->
    <circle cx="250" cy="250" r="85"
      fill="none"
      stroke="url(#ring)"
      stroke-width="3"
      opacity="0.5"
      filter="url(#glow)"/>

  </g>

  <!-- Pulsing effect -->
  <circle cx="250" cy="250" r="145"
    fill="none"
    stroke="url(#ring)"
    stroke-width="2"
    opacity="0.2">

    <animate attributeName="r"
      values="140;150;140"
      dur="3s"
      repeatCount="indefinite"/>

    <animate attributeName="opacity"
      values="0.1;0.4;0.1"
      dur="3s"
      repeatCount="indefinite"/>

  </circle>

</svg>